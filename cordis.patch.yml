# @superfish058/dsh-llm-proxy v1.5.0 — bundle patch: inserts the LLM proxy-routing plugin row (deployment-global).
#
# v1.0.0 redesign (model-level intent):
#   proxyHost      proxy hostname/IP (does not have to be this machine; default 127.0.0.1)
#   proxyPort      proxy port (default 7897)
#   proxiedModels  model keys that route through the proxy, `<providerId>/<modelId>`
#                  (resolved against llm-pi-ai + llm-deepseek settings); everything
#                  else stays DIRECT. Loopback hosts are always direct.
#   retries        mirrored into the official `retryPolicy` of every SELECTED provider
#                  (maxRetries); the retry itself is executed by dsh-llm-retry, not by
#                  this plugin — since v1.4.0 there is no transport-layer RetryAgent
#   retryIntervalMs fixed delay between those retries (ms, mirrored as initialDelayMs)
#
# dsh 0.1.7: every field below is a live (`volatile`) Config field, so the row's values
# are the plugin's settings document (Loader entry id `llm-proxy`) — edits made in
# 设置 → 插件 → 模型代理 are written straight back here by the Host and apply live.
#
# Engine: with the official @deepseek-ai/dsh-http-proxy installed (dsh >= 0.1.3) the
# plugin feeds that package a computed policy instead of installing its own dispatcher;
# older harnesses fall back to the bundled RoutingDispatcher.
#
# Edit values below, or use the 设置 → 插件 → 模型代理 page (which also lists the selectable models).
- insert:
    - id: llm-proxy
      name: '@superfish058/dsh-llm-proxy'
      config:
        proxyHost: '127.0.0.1'
        proxyPort: 7897
        # proxiedModels:
        #   - 'deepseek-v4-flash/deepseek-v4-flash'   # b.ai provider
        retries: 3
        retryIntervalMs: 1000
